services:
  mysqldb:
    image: naveenkumar30/bloodbank:dbImage${BUILD_NUMBER}
    ports:
      - "3306:3306"
    deploy:
      replicas: 3

  app:
    image: naveenkumar30/bloodbank:appImage${BUILD_NUMBER}
    ports:
      - "2222:80"
    depends_on:
      - db
    deploy:
      replicas: 3
